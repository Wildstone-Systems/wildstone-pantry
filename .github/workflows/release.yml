name: Release

# Tag a release (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to publish
# the multi-arch product image to GHCR (ADR 0018 §4). The migration gate runs
# the FULL alembic chain against real Postgres first — images are never
# published from a revision that cannot migrate a real database.

on:
  push:
    tags: ["v*"]

# Least privilege: nothing by default; only the publish job gets write scopes.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/wildstone-systems/pantryos

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantryos_ci
          POSTGRES_PASSWORD: pantryos_ci
          POSTGRES_DB: pantryos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantryos_ci -d pantryos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: alembic upgrade head
      - name: Alembic chain is reentrant (upgrade is a no-op when current)
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: alembic upgrade head

  publish:
    runs-on: ubuntu-latest
    needs: migration-gate
    permissions:
      contents: write # creates the GitHub Release carrying manifest.json
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version (tag without the v prefix)
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A hyphen means a prerelease (v0.2.0-rc1). Those must NOT retarget
          # `stable` or `releases/latest` — both are followed by real installs
          # and by the update supervisor, so a build aimed at one tester would
          # otherwise land on every box that auto-updates.
          if [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push updater (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wildstone-systems/pantryos-updater:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('ghcr.io/wildstone-systems/pantryos-updater:{0}', 'stable') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Job summary (digest for pinning)
        run: |
          echo "## PantryOS ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin installs by digest (ADR 0018 §6): \`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Write update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "image": "${{ env.IMAGE }}",
            "digest": "${{ steps.push.outputs.digest }}",
            "urgency": "normal",
            "notes_url": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          EOF
          cat manifest.json
      # Build the tester deployment bundle for this exact version, so there is
      # one immutable, version-pinned copy per release rather than a moving
      # branch path.
      #
      # Note what this does NOT do: while the repo is private, these assets are
      # not fetchable by a tester. Release-asset downloads authorize against
      # repository Contents, which a read:packages token does not grant — so
      # any credential that reaches them also reaches the source. The assets
      # are the maintainer's copy to hand over out of band; a public mirror
      # repo is the fix if that ever needs to scale (see the audit doc).
      - name: Assemble tester deployment bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p bundle
          cp release/docker-compose.yml release/README.md bundle/
          # Pre-pin the version the tester actually installs, so their first
          # edit is their two secrets and nothing else.
          sed "s/^PANTRYOS_VERSION=.*/PANTRYOS_VERSION=$VERSION/" \
            release/.env.example > bundle/.env.example
          grep -q "^PANTRYOS_VERSION=$VERSION$" bundle/.env.example \
            || { echo "::error::PANTRYOS_VERSION substitution failed"; exit 1; }
          # .env.example is dotfile-named; zip the set so nothing is lost to a
          # browser download and testers get one thing to fetch.
          (cd bundle && zip -r ../pantryos-tester-$VERSION.zip . )
          ls -la bundle && ls -l pantryos-tester-$VERSION.zip
      - name: Create GitHub Release with manifest and tester bundle
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            manifest.json
            bundle/docker-compose.yml
            bundle/.env.example
            bundle/README.md
            pantryos-tester-${{ steps.version.outputs.version }}.zip
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
