name: Publication secret audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Include all retained refs
        run: |
          git fetch origin \
            '+refs/heads/*:refs/audit/heads/*' \
            '+refs/tags/*:refs/audit/tags/*'
          pull_refs=$(git ls-remote --refs origin 'refs/pull/*/head' 'refs/pull/*/merge')
          if grep -q 'refs/pull/.*/head' <<< "$pull_refs"; then
            git fetch origin '+refs/pull/*/head:refs/audit/pull-head/*'
          fi
          if grep -q 'refs/pull/.*/merge' <<< "$pull_refs"; then
            git fetch origin '+refs/pull/*/merge:refs/audit/pull-merge/*'
          fi
      - name: Check publication privacy
        run: python3 scripts/check_publication_hygiene.py
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/$checksums" --output "$checksums"
          awk -v file="$archive" '$2 == file { print; found=1 } END { if (!found) exit 1 }' "$checksums" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan current files
        run: gitleaks dir --redact=100 --no-banner .
      - name: Scan all fetched history
        if: success() || failure()
        run: gitleaks git --log-opts="--all --full-history" --redact=100 --no-banner .
