name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Config guards
        run: |
          python scripts/check_env_parity.py
          python scripts/check_alembic_revisions.py
      - name: Protected-env startup refuses insecure defaults
        run: python scripts/check_protected_env.py
      - name: Tests (in-process, SQLite)
        run: python -m pytest -q
      - name: Ruff (non-blocking)
        run: ruff check . || true
      - name: Mypy (non-blocking)
        run: mypy app core modules || true
      - name: Bandit security scan (non-blocking)
        run: bandit -q -r app core modules || true

  # Migrations are exercised against real Postgres on every PR (ADR 0018 §6) —
  # the SQLite test harness uses create_all, so without this job a broken
  # migration only surfaces at deploy time.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantryos_ci
          POSTGRES_PASSWORD: pantryos_ci
          POSTGRES_DB: pantryos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantryos_ci -d pantryos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: alembic upgrade head
      - name: Recipe review history survives ordinary edits on PostgreSQL
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: python scripts/check_recipe_history_postgres.py --confirm-ci-database
      - name: Ranked identity PostgreSQL locks and atomic confirmation
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: python scripts/check_ranked_identity_postgres.py --confirm-ci-database

      - name: Receipt review PostgreSQL replay, concurrency and rollback
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: python scripts/check_receipt_review_postgres.py --confirm-ci-database

      - name: Purchase CSV PostgreSQL source claims, races and rollback
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: python scripts/check_purchase_review_postgres.py --confirm-ci-database

      - name: Scoped substitutions PostgreSQL approvals and cook retries
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql+psycopg://pantryos_ci:pantryos_ci@localhost:5432/pantryos
        run: python scripts/check_scoped_substitutions_postgres.py --confirm-ci-database

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Module boundary check
        run: npm run check:boundaries
      - name: Lint
        run: npm run lint || true
      - name: Typecheck
        run: npx tsc -b
      - name: Tests
        run: npm run test:run
      - name: Build
        run: npm run build

  qa:
    name: Standard QA gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install QA dependencies
        run: |
          python -m pip install requests==2.32.3
          npm ci --prefix frontend
      - name: Run standard QA, including Docker and smoke checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/qa.sh 2>&1 | tee qa-gate.log
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-qa-${{ github.sha }}
          path: qa-gate.log
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up development stack
        if: always()
        run: docker compose down -v
