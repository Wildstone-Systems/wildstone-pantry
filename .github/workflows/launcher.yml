name: Launcher

# Builds the Tauri desktop launcher on real Windows/macOS runners (the dev
# sandbox has no webkit toolchain). Unsigned artifacts for now — signing is
# budgeted at beta (ADR 0018 §4): wire Apple + Azure Trusted Signing secrets
# into this workflow when the accounts exist.

on:
  workflow_dispatch:
  push:
    tags: ["launcher-v*"]
    paths: ["launcher/**", ".github/workflows/launcher.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_glob: |
              launcher/src-tauri/target/release/bundle/msi/*.msi
              launcher/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle_glob: launcher/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
      - name: Build launcher (unsigned)
        working-directory: launcher
        run: npx --yes @tauri-apps/cli@^2 build
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pantryos-launcher-${{ matrix.os }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
