# Serves the built SPA and reverse-proxies the API, mirroring the proxy rules in
# frontend/vite.config.ts so the browser stays same-origin (no CORS needed).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Receipt / recipe-image uploads (backend caps images at 8 MB; leave headroom).
  client_max_body_size 32m;

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Must revalidate so new deploys (and the PWA service worker) are picked up.
  location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Same paths as the Vite dev proxy.
  location ~ ^/(api|health|openapi\.json|docs|redoc) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;  # keep the public port (OIDC / Kroger callbacks use request.base_url)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # OCR / classifier calls can be slow
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
