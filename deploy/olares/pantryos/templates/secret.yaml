apiVersion: v1
kind: Secret
metadata:
  name: pantryos-runtime
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" (.Values.postgres.username | urlquery | replace "+" "%20") (.Values.postgres.password | urlquery | replace "+" "%20") .Values.postgres.host .Values.postgres.port (.Values.postgres.databases.pantryos | urlquery | replace "+" "%20") | quote }}
  CONFIG_SECRET_KEY: {{ .Values.olaresEnv.CONFIG_SECRET_KEY | quote }}
