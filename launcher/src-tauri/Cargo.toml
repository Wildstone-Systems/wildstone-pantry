[package]
name = "pantryos-launcher"
version = "0.1.0"
description = "PantryOS desktop installer/launcher (ADR 0018 §4): Docker as an implementation detail."
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"
rand = "0.10"
base64 = "0.23"
ureq = "3"

[profile.release]
strip = true
lto = true
